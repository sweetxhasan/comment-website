<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Website</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * {
            font-family: 'Space Grotesk', sans-serif;
            border-radius: 0 !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent mb-4">
                Comment Section
            </h1>
            <p class="text-gray-600 text-lg">Share your thoughts with everyone</p>
        </header>

        <!-- Comment Form -->
        <div class="bg-white p-6 shadow-lg mb-8">
            <form id="commentForm" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="ri-user-line mr-2"></i>Your Name
                    </label>
                    <input 
                        type="text" 
                        id="name" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Enter your name">
                </div>
                
                <div>
                    <label for="comment" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="ri-chat-3-line mr-2"></i>Your Comment
                    </label>
                    <textarea 
                        id="comment" 
                        required
                        rows="4"
                        class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="What's on your mind?"></textarea>
                </div>
                
                <button 
                    type="submit"
                    class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 px-6 font-semibold hover:from-blue-600 hover:to-purple-700 transition-all duration-200 transform hover:scale-[1.02]">
                    <i class="ri-send-plane-line mr-2"></i>Post Comment
                </button>
            </form>
        </div>

        <!-- Comments List -->
        <div id="commentsContainer" class="space-y-6">
            <!-- Comments will be loaded here -->
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-8">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
            <p class="text-gray-600 mt-4">Loading comments...</p>
        </div>
    </div>

    <!-- Reply Modal -->
    <div id="replyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white p-6 max-w-md w-full mx-4">
            <h3 class="text-xl font-bold mb-4">Reply to Comment</h3>
            <form id="replyForm">
                <input type="hidden" id="replyParentId">
                <div class="mb-4">
                    <label for="replyName" class="block text-sm font-medium text-gray-700 mb-2">
                        Your Name
                    </label>
                    <input 
                        type="text" 
                        id="replyName" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="mb-4">
                    <label for="replyComment" class="block text-sm font-medium text-gray-700 mb-2">
                        Your Reply
                    </label>
                    <textarea 
                        id="replyComment" 
                        required
                        rows="3"
                        class="w-full px-4 py-3 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                <div class="flex space-x-3">
                    <button 
                        type="submit"
                        class="flex-1 bg-gradient-to-r from-blue-500 to-purple-600 text-white py-2 px-4 font-semibold hover:from-blue-600 hover:to-purple-700">
                        Post Reply
                    </button>
                    <button 
                        type="button"
                        onclick="closeReplyModal()"
                        class="flex-1 bg-gradient-to-r from-gray-500 to-gray-600 text-white py-2 px-4 font-semibold hover:from-gray-600 hover:to-gray-700">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
              </html>
